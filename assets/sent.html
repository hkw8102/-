<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>送信しました | PLUSWIN</title>
<style>
  html,body{margin:0;height:100%}
  body{background:#08080a;color:#f3f2ef;font-family:"PW Sans JP","Helvetica Neue",system-ui,sans-serif;
       display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.8}
  .box{padding:32px}
  .mark{width:34px;height:34px;margin:0 auto 16px;border:1.6px solid #8ee0a1;border-radius:50%;position:relative}
  .mark::after{content:"";position:absolute;left:9px;top:10px;width:13px;height:6px;
               border-left:1.7px solid #8ee0a1;border-bottom:1.7px solid #8ee0a1;transform:rotate(-45deg)}
  h1{font-size:15px;margin:0 0 8px;letter-spacing:.01em}
  p{font-size:11.5px;color:#9d9da8;margin:0}
  .back{display:inline-block;margin-top:16px;font-size:11px;color:#ff4b2b;text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <div class="mark" aria-hidden="true"></div>
    <h1>送信しました</h1>
    <p>担当者より2〜3営業日以内にご連絡します。<br>Thank you — our team will reply within 2–3 business days.<br>접수되었습니다. 담당자가 2~3영업일 이내에 연락드리겠습니다.</p>
    <a class="back" id="back" href="../hall.html">ホールページへ / Back to the hall / 홀 페이지로</a>
    <script>
      /* send the visitor back to the page whose form they used (stand flowers → stand page) */
      (function () {
        try {
          var from = new URLSearchParams(location.search).get("from");
          var back = document.getElementById("back");
          if (from === "estimate" && back) {
            back.href = "../estimate.html";
            back.textContent = "見積ページへ / Back to the quote / 견적 페이지로";
          }
          if (from === "stand" && back) {
            back.href = "../stand.html";
            back.textContent = "申請ページへ / Back to the application page / 신청 페이지로";
          }
        } catch (e) {}
      })();
    </script>
  </div>
</body>
</html>
